# Railway Configuration
# This tells Railway to build from the server directory

[build]
builder = "NIXPACKS"
watchPatterns = ["docsumo_email_inbox_storybook/server/**"]

[deploy]
startCommand = "cd docsumo_email_inbox_storybook/server && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
